  var h   = Math.round(r.height);
  if (!w || !h) return;

  plDc.width        = w * dpr;
  plDc.height       = h * dpr;
  plDc.style.width  = w + 'px';
  plDc.style.height = h + 'px';

  dcCtx.setTransform(1, 0, 0, 1, 0, 0);
  dcCtx.scale(dpr, dpr);

  // Redraw overlay at current level (important after resize)
  if (!done) {
    paintOverlay(currentOverlay);
  }
}

// ── DRAW OVERLAY ───────────────────────────────────────────────
// alpha: 1.0 = fully dark (hidden), 0.0 = fully transparent (revealed)
function paintOverlay(alpha) {
  currentOverlay = alpha;
  var w = plDc.offsetWidth;
  var h = plDc.offsetHeight;
  if (!w || !h) return;

  dcCtx.clearRect(0, 0, w, h);

  if (alpha <= 0) return; // fully revealed — nothing to draw

  // Dark navy base
  dcCtx.fillStyle = 'rgba(12,18,34,' + alpha + ')';
  dcCtx.fillRect(0, 0, w, h);

  // Subtle blue radial glow
  var grd = dcCtx.createRadialGradient(w*.5, h*.45, 0, w*.5, h*.45, w*.6);
  grd.addColorStop(0, 'rgba(50,75,160,' + (alpha * 0.14) + ')');
  grd.addColorStop(1, 'rgba(12,18,34,0)');
  dcCtx.fillStyle = grd;
  dcCtx.fillRect(0, 0, w, h);
}

// ── ANIMATE FINAL REVEAL ───────────────────────────────────────
// KEY FIX 2: correct easing, no opacity reset, direct property assignment
function animReveal(onDone) {
  var startAlpha = currentOverlay; // wherever we left off (e.g. 0.6 after 3 partial taps)
  var startImgOp = parseFloat(plImg.style.opacity) || 0;
  var startTime  = null;
  var dur        = 1000; // ms

  function step(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;
    var t = Math.min(elapsed / dur, 1);

    // KEY FIX 2: safe ease-in-out cubic (no --p mutation!)
    var ease = t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;

    // Overlay fades from startAlpha → 0
    var newAlpha = startAlpha * (1 - ease);
    paintOverlay(newAlpha);

    // Photo fades from startImgOp → 1
    // KEY FIX 1: direct assignment — no CSS transition fighting this
    plImg.style.opacity = startImgOp + (1 - startImgOp) * ease;

    if (t < 1) {
      requestAnimationFrame(step);
    } else {
      // Fully revealed
      paintOverlay(0);
      plImg.style.opacity = '1';
      plDc.style.display  = 'none'; // hide canvas, no longer needed
      done = true;
      if (onDone) onDone();
    }
  }

  requestAnimationFrame(step);
}

// ── TAP HANDLER ────────────────────────────────────────────────
function doTap() {
  if (done) return;
  taps++;

  // Show progress bar on first tap
  if (taps === 1) {
    plProg.style.opacity = '1';
  }

  // Shake animation
  var cls = 'shk' + Math.min(taps, 3);
  plOut.classList.remove('shk1', 'shk2', 'shk3');
  void plOut.offsetWidth; // force reflow so animation restarts
  plOut.classList.add(cls);
  setTimeout(function() { plOut.classList.remove(cls); }, 700);

  // Progress bar
  plProgBar.style.width = ((taps / SH) * 100) + '%';

  // Partial reveal per tap:
  // Tap 1: photo=0.30, overlay=0.70
  // Tap 2: photo=0.60, overlay=0.40
  // Tap 3: triggers full animated reveal (from 0.60 → 1.0)
  var partialReveal = (taps / SH) * 0.6; // 0.2 per tap, max 0.6 at tap 3
  paintOverlay(1 - partialReveal);
  plImg.style.opacity = partialReveal; // direct assignment, no CSS transition

  // Update hint text
  var rem = SH - taps;
  if (rem > 0) {
    plHint.textContent = rem + ' more tap' + (rem > 1 ? 's' : '') + ' to reveal';
  }

  // On final tap: fire the full reveal animation
  if (taps >= SH && !done) {
    done = true; // prevent re-entry
    setTimeout(function() {
      // Hide action buttons smoothly
      plAction.style.opacity    = '0';
      plAction.style.transition = 'opacity .5s';
      // Run the animated reveal
      animReveal(function() {
        // Once fully revealed: hide action area entirely, show date/venue
        plAction.style.display = 'none';
        plReveal.classList.add('show');
        // Fire confetti
        fireConfetti();
      });
    }, 350);
  }
}

// ── EVENT LISTENERS ────────────────────────────────────────────
// Both polaroid AND ring button trigger a tap
plOut.addEventListener('click', doTap);
plOut.addEventListener('touchend', function(e) {
  e.preventDefault();
  doTap();
}, { passive: false });

plRing.addEventListener('click', doTap);
plRing.addEventListener('touchend', function(e) {
  e.stopPropagation();
  e.preventDefault();
  doTap();
}, { passive: false });

// ── CANVAS INIT ────────────────────────────────────────────────
window.addEventListener('load',   sizeCanvas);
window.addEventListener('resize', sizeCanvas);
plImg.addEventListener('load',    sizeCanvas);
setTimeout(sizeCanvas, 100);
setTimeout(sizeCanvas, 500);

// ── CONFETTI ───────────────────────────────────────────────────
function fireConfetti() {
  confCanvas.width  = window.innerWidth;
  confCanvas.height = window.innerHeight;

  var PAL = [
    '#e8c870','#f0d890','#f5e8b0','#fffaec',
    '#e0c4a0','rgba(220,190,120,.7)','#d4a840','rgba(255,245,220,.8)'
  ];
  var parts = [];
  for (var i = 0; i < 80; i++) {
    parts.push({
      x:     Math.random() * confCanvas.width,
      y:     -20 - Math.random() * 80,
      vx:    (Math.random() - .5) * .9,
      vy:    Math.random() * .55 + .25,
      w:     Math.random() * 9 + 2.5,
      h:     Math.random() * 3.5 + 1.5,
      rot:   Math.random() * 360,
      rotV:  (Math.random() - .5) * 1.2,
      color: PAL[Math.floor(Math.random() * PAL.length)],
      shape: Math.random() > .55 ? 'circle' : 'rect',
      r:     Math.random() * 3.5 + 1.2,
      swing: Math.random() * Math.PI * 2,
      swingS:.012 + Math.random() * .01,
      alpha: .6 + Math.random() * .35
    });
  }

  var frame = 0, TOTAL = 500;
  (function draw() {
    frame++;
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
    var fade = frame > TOTAL * .7
      ? 1 - (frame - TOTAL * .7) / (TOTAL * .3)
      : 1;

    parts.forEach(function(p) {
      p.swing += p.swingS;
      p.x     += p.vx + Math.sin(p.swing) * .4;
      p.y     += p.vy;
      p.rot   += p.rotV;
      if (p.y > confCanvas.height + 20) {
        p.y = -15;
        p.x = Math.random() * confCanvas.width;
      }
      confCtx.save();
      confCtx.globalAlpha = p.alpha * fade;
      confCtx.translate(p.x, p.y);
      confCtx.rotate(p.rot * Math.PI / 180);
      confCtx.fillStyle = p.color;
      if (p.shape === 'circle') {
        confCtx.beginPath();
        confCtx.arc(0, 0, p.r, 0, Math.PI * 2);
        confCtx.fill();
      } else {
        confCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      }
      confCtx.restore();
    });

    if (frame < TOTAL) requestAnimationFrame(draw);
    else confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  })();
}

window.addEventListener('resize', function() {
  confCanvas.width  = window.innerWidth;
  confCanvas.height = window.innerHeight;
});

})();
