  else{ppAudio.pause();ppPause.style.display="none";ppPlay.style.display="block";}
};

/* pre-render 6 sprite variants */
var sprites=[],loadedN=0,appStarted=false;
function preRender(img,fx,fy){
  var oc=document.createElement("canvas");
  oc.width=img.naturalWidth;oc.height=img.naturalHeight;
  var x=oc.getContext("2d");
  x.save();
  if(fx){x.translate(oc.width,0);x.scale(-1,1);}
  if(fy){x.translate(0,oc.height);x.scale(1,-1);}
  x.drawImage(img,0,0);x.restore();
  oc.sw=oc.width;oc.sh=oc.height;
  sprites.push(oc);
}
RAW.forEach(function(d){
  var im=new Image();
  im.onload=function(){preRender(im,false,false);preRender(im,true,false);preRender(im,false,true);loadedN++;if(loadedN>=RAW.length)initApp();};
  im.onerror=function(){loadedN++;if(loadedN>=RAW.length)initApp();};
  im.src=d.src;
});
